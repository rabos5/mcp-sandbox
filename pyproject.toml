[tool.poetry]
name = "mcp-rest-server"
version = "0.1.0"
description = "A REST API wrapper for MCP-style tools, designed for internal LLM gateway integration"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "mcp_rest_server", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.24.0"
httpx = "^0.27.0"

[tool.poetry.scripts]
mcp-rest-server = "mcp_rest_server.main:run"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
